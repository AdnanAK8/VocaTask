[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prevent Netlify SPA fallback from returning 200 HTML index.html for backend API routes
[[redirects]]
  from = "/api/*"
  status = 404

# SPA fallback for React App Router / client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200