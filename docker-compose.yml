services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicetasks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEFAULT_TIMEZONE=Asia/Kolkata
      - DATABASE_URL=${DATABASE_URL:-}
      - PGHOST=${PGHOST:-host.docker.internal}
      - PGPORT=${PGPORT:-5433}
      - PGDATABASE=${PGDATABASE:-vocatask}
      - PGUSER=${PGUSER:-vocatask_user}
      - PGPASSWORD=${PGPASSWORD:-}
      - DATABASE_POOL_MAX_SIZE=${DATABASE_POOL_MAX_SIZE:-2}
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ELEVEN_LAB_API_KEY=${ELEVEN_LAB_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicetasks-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
