services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicetasks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEFAULT_TIMEZONE=Asia/Kolkata
      - DATABASE_PATH=/app/data/tasks.db
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: voicetasks-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
