version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: APP_PORT
  env:
    - name: DEFAULT_TIMEZONE
      value: "Asia/Kolkata"
    - name: DATABASE_POOL_MAX_SIZE
      value: "5"
    - name: DATABASE_POOL_TIMEOUT
      value: "10"
